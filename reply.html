<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이웃 새 글 댓글</title>
<style>
 :root{--bd:#e2e2e2;--mut:#888}
 *{box-sizing:border-box}
 body{font:16px/1.6 system-ui,-apple-system,"맑은 고딕",sans-serif;margin:0;padding:12px;
      max-width:760px;margin-inline:auto;color:#222;background:#fff}
 h1{font-size:19px;margin:0 0 2px}
 .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
 .card{border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:11px}
 .card.done{opacity:.32}
 .top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
 .who a{color:#1a7f3c;text-decoration:none;font-weight:600}
 .why{font-size:12px;color:#a06000;background:#fff8e6;border-radius:4px;padding:2px 7px}
 .date{color:#bbb;font-size:12px;margin-left:auto}
 .title{display:block;margin:7px 0 9px;color:#1c4fd8;text-decoration:none;font-size:14px}
 .lbl{font-size:11px;color:#999;margin:9px 0 3px}
 /* 후보는 눌러서 고른다. 버튼을 따로 두면 폰에서 손이 두 번 간다 */
 .cm{background:#fafafa;border-left:3px solid #d5d5d5;padding:10px 11px;margin-bottom:6px;
     border-radius:0 6px 6px 0;font-size:14px;cursor:pointer}
 .cm:active{background:#eee}
 .cm.pick{border-left-color:#1a7f3c;background:#f2f9f4}
 .row{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
 button{font:inherit;font-size:14px;padding:9px 14px;border:1px solid #ccc;background:#fff;
        border-radius:8px;cursor:pointer;flex:1;min-width:96px}
 button:active{background:#eee}
 .fin{background:#1a7f3c;color:#fff;border-color:#1a7f3c;font-weight:600}
 .card.done .fin{background:#fff;color:#1a7f3c}
 .empty{color:var(--mut);text-align:center;padding:40px 0}
 footer{color:var(--mut);font-size:12px;margin:22px 0 40px;text-align:center}
</style></head><body>

<h1>이웃 새 글 <span id="left">14</span>건</h1>
<div class="sub">후보를 <b>탭하면 복사</b>된다. 글 열고 → 좋아요 → 붙여넣기 → <b>완료</b>.</div>
<div id="list"></div>
<div class="row" style="margin:20px 0"><button id="dump">완료 목록 복사</button></div>

ate": "2026-09-28", "categ": "리뷰", "cms": ["같은 레시피인데 지점마다 다른 건 진짜 신기하죠", "지점별로 팬이 있다는 게 웃깁니다 ㅋㅋ", "감자 당근 큼직한 게 은근 중요하죠"]}, {"bid": "kimpaha", "logNo": "224424878515", "who": "막해보고 기록하는 일기", "title": "특허청 수수료 반환 환불 후기｜과오납 31만원 두 달째 미환급, 전화해서 해결한 과정", "link": "https://blog.naver.com/kimpaha/224424878515", "date": "2026-09-28", "categ": "일상 리뷰", "cms": ["기다리지 말고 전화하라는 게 결론이군요", "두 번 걸고 두 달이면 속 좀 터지셨겠어요", "31만원이면 그냥 넘길 금액이 아니죠"]}, {"bid": "mming0104", "logNo": "224425005582", "who": "꾸루밍로그❤️", "title": "광화문 고기집 소고기 맛집 화로담 | 화로에 구워 먹는 야키니쿠 전문점", "link": "https://blog.naver.com/mming0104/224425005582", "date": "2026-09-28", "categ": "맛집", "cms": ["사장님이 고기 설명해주는 집은 일단 다르죠", "화로에 구우면 이야기하기도 좋겠네요", "광화문에 야키니쿠 전문점이 있는 줄 몰랐습니다"]}, {"bid": "gureum128", "logNo": "224424438181", "who": "구르미의 일상", "title": "노브랜드 신상 과자 ㅣ미니머랭비스킷ㅣ리뷰", "link": "https://blog.naver.com/gureum128/224424438181", "date": "2026-09-28", "categ": "후기 기록", "cms": ["머랭은 집에서 만들기 제일 까다로운 디저트죠", "노브랜드에서 나온 건 몰랐네요", "간식 리뷰 보다가 장보기 목록이 늘어납니다 ㅋㅋ"]}, {"bid": "sying925", "logNo": "224424956649", "who": "Live-ing Diary", "title": "성남 분당 웨딩홀 밝은 베뉴 위주 견적 비교하고 상담받기", "link": "https://blog.naver.com/sying925/224424956649", "date": "2026-09-28", "categ": "준비", "cms": ["식장부터 계약해야 진짜 시작이라는 말 맞는 것 같아요", "내년 하반기가 벌써 찬다니 서두르셔야겠네요", "다섯 곳 비교는 품이 많이 들었겠어요"]}, {"bid": "qkrwjd2321", "logNo": "224422725250", "who": "소소 한 여정 ･ﾟ✧", "title": "김해 맛집 코스요리, 동백｜가성비 갑 룸 있는 가족모임 맛집 가족정식 4인세트 후기", "link": "https://blog.naver.com/qkrwjd2321/224422725250", "date": "2026-09-25", "categ": "소소한 맛집", "cms": ["룸 있는 중식당은 가족 모임에 진리죠", "한 번이 아니라 여러 번 가신 집이라 더 믿음이 갑니다", "돌잔치까지 되는 곳이면 활용도가 넓겠어요"]}, {"bid": "lhjin2580", "logNo": "224417813066", "who": "Nevertheless,", "title": "[성수_진대광부대찌개 : 푸짐한 햄의양과 다양한 후식디저트]", "link": "https://blog.naver.com/lhjin2580/224417813066", "date": "2026-09-25", "categ": "맛집", "cms": ["송탄식은 햄 양부터 다르죠", "밥 리필되는 것만으로 점수 주고 갑니다", "성수역 1번 출구 31m면 찾기도 쉽겠네요"]}, {"bid": "aldusltkfkd", "logNo": "224421656105", "who": "나니의 매일매일봄날", "title": "대학로 맛집 훠궈먹고 대학로점 ; 처음 간다면 꿀조합 추천(feat.르세라핌 훠궈)", "link": "https://blog.naver.com/aldusltkfkd/224421656105", "date": "2026-09-24", "categ": "맛", "cms": ["회전레일로 훠궈 재료가 돌아온다니 아이들이 좋아하겠어요", "각자 냄비 하나씩이면 취향대로 되겠네요", "90분이면 충분할지 궁금하네요"]}], GAS="https://script.google.com/macros/s/AKfycbwJ27_GZz3O8LH8dMm-1PnGLX9o-bO7MexEaYnRhO0PKEd-_jy92IDnKp_vcMr5QCs8pw/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const keyOf=r=>r.bid+"/"+r.logNo;

// 완료 표시는 로컬에 먼저 남긴다. 시트가 느리거나 실패해도 화면은 정확하게.
const LS="reply_done";
const local=new Set(JSON.parse(localStorage.getItem(LS)||"[]"));
const save=()=>localStorage.setItem(LS,JSON.stringify([...local]));

function draw(){
  $("list").innerHTML = ROWS.length ? ROWS.map(r=>{
    const k=keyOf(r), d=local.has(k);
    return `<div class="card${d?" done":""}" data-key="${k}">
      <div class="top">
        <!-- 닉네임도 글로 보낸다. 블로그 홈으로 보내면 최신 글을 다시 찾아 눌러야 한다 -->
        <span class="who"><a href="${r.link}" target="_blank" rel="noopener">${esc(r.who)}</a></span>
        ${r.categ?`<span class="why">${esc(r.categ)}</span>`:""}
        <span class="date">${esc(r.date)}</span>
      </div>
      <a class="title" href="${r.link}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <div class="lbl">후보 — 탭하면 복사</div>
      ${r.cms.map(c=>`<div class="cm" data-cm>${esc(c)}</div>`).join("")}
      <div class="row">
        <button class="fin" data-fin>${d?"완료됨":"완료"}</button>
      </div></div>`;
  }).join("") : `<div class="empty">새 글이 없다.</div>`;
  $("left").textContent = ROWS.filter(r=>!local.has(keyOf(r))).length;
}

$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card"); if(!card)return;
  const key=card.dataset.key;
  const cm=e.target.closest("[data-cm]");
  if(cm){
    navigator.clipboard.writeText(cm.innerText).then(()=>{
      // 어느 걸 골랐는지 남는다. 붙여넣다 놓쳐도 다시 찾을 필요가 없다
      card.querySelectorAll("[data-cm]").forEach(x=>x.classList.remove("pick"));
      cm.classList.add("pick");
    });
    return;
  }
  if(!e.target.closest("[data-fin]"))return;
  if(local.has(key)){                       // 잘못 눌렀을 때 되돌리기
    if(!confirm("완료를 취소할까?"))return;
    local.delete(key); save(); draw(); return;
  }
  local.add(key); save(); draw();
  if(!GAS)return;
  const r=ROWS.find(x=>keyOf(x)===key);
  const pw=localStorage.getItem("pw")||prompt("비밀번호"); if(!pw)return;
  localStorage.setItem("pw",pw);
  // no-cors + text/plain — preflight를 피한다. 응답은 못 읽으니 화면은 이미 반영해뒀다.
  fetch(GAS,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({pw,kind:"comment",bid:r.bid,logNo:r.logNo,who:r.who,title:r.title})})
    .catch(()=>{ $("foot").textContent="전송 실패 — 네트워크 확인 후 다시 눌러라."; });
});

draw();

// 시트가 죽어 있어도 회수는 되게. 폰에 쌓인 완료분을 .replied.txt 형식으로 뱉는다.
$("dump").onclick=()=>{
  const d=ROWS.filter(r=>local.has(keyOf(r)));
  if(!d.length)return alert("완료한 게 없다.");
  const day=new Date().toLocaleDateString("sv-SE");  // 로컬 기준 YYYY-MM-DD
  const lines=d.map(r=>`${day}  ${r.link}  ${r.who}  ${r.title}`);
  navigator.clipboard.writeText(lines.join(String.fromCharCode(10)))
    .then(()=>alert(d.length+"건 복사됨. 클로드한테 붙여넣어라."),
          ()=>alert("복사 실패. 길게 눌러 직접 선택해라."));
};

// 다른 기기에서 누른 것도 보이게 시트를 겹쳐 읽는다. JSONP로 CORS 우회.
if(GAS){
  window.__ov=rows=>{
    (rows||[]).forEach(r=>{ if(r.bid&&r.logNo) local.add(r.bid+"/"+r.logNo); });
    save(); draw();
    $("foot").textContent="시트 동기화됨 · "+local.size+"건 완료";
  };
  const s=document.createElement("script");
  s.src=GAS+"?kind=comment&callback=__ov";
  s.onerror=()=>{$("foot").textContent="시트를 못 읽었다. 완료는 이 기기에만 남는다.";};
  document.body.appendChild(s);
}
</script></body></html>
