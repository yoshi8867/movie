<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서이추 대상</title>
<style>
 :root{--bd:#e2e2e2;--mut:#888}
 *{box-sizing:border-box}
 body{font:16px/1.6 system-ui,-apple-system,"맑은 고딕",sans-serif;margin:0;padding:12px;
      max-width:760px;margin-inline:auto;color:#222;background:#fff}
 h1{font-size:19px;margin:0 0 2px}
 .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;
       background:#fff;padding:6px 0;z-index:5;border-bottom:1px solid var(--bd)}
 .tab{font:inherit;font-size:13px;padding:6px 12px;border:1px solid #ccc;background:#fff;
      border-radius:16px;cursor:pointer}
 .tab.on{background:#222;color:#fff;border-color:#222}
 .card{border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:11px}
 .card.done{opacity:.32}
 .top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
 .g{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;color:#fff}
 .who a{color:#1a7f3c;text-decoration:none;font-weight:600}
 .why{font-size:12px;color:#a06000;background:#fff8e6;border-radius:4px;padding:2px 7px}
 .date{color:#bbb;font-size:12px;margin-left:auto}
 .title{display:block;margin:7px 0 9px;color:#1c4fd8;text-decoration:none;font-size:14px}
 .lbl{font-size:11px;color:#999;margin:9px 0 3px}
 .cm{background:#fafafa;border-left:3px solid #d5d5d5;padding:9px 11px;
     border-radius:0 6px 6px 0;white-space:pre-wrap;font-size:14px}
 .cm.si{border-left-color:#3a5fcd;background:#f6f8ff}
 .row{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
 button{font:inherit;font-size:14px;padding:9px 14px;border:1px solid #ccc;background:#fff;
        border-radius:8px;cursor:pointer;flex:1;min-width:96px}
 button:active{background:#eee}
 .fin{background:#1a7f3c;color:#fff;border-color:#1a7f3c;font-weight:600}
 .card.done .fin{background:#fff;color:#1a7f3c}
 .empty{color:var(--mut);text-align:center;padding:40px 0}
 footer{color:var(--mut);font-size:12px;margin:22px 0 40px;text-align:center}
</style></head><body>

<h1>서이추 대상 <span id="left">5</span>명</h1>
<div class="sub">좋아요 3개 + 댓글 1개 → 서이추 → <b>완료</b>. 하루 5~7명.</div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div class="row" style="margin:20px 0"><button id="dump">완료 목록 복사</button></div>
<footer id="foot"></footer>

<script>
const ROWS=[{"g": "A", "bid": "gotnrekdns", "who": "호떡", "why": "임당검사 4시간 대기 · 글이 재밌음", "home": "https://blog.naver.com/gotnrekdns", "link": "https://blog.naver.com/gotnrekdns/224386472977", "title": "백천만년 걸리는 임당검사 시간 보내면서 쓰는 요즘 내 일상?", "date": "08-22", "cm": "수치 2점 차이로 4시간이라니 ㅋㅋㅋ 이어폰까지 방전된 게 압권이네요. 그 와중에 애니 완주하신 건 대단합니다", "si": "저희는 10월 출산 예정입니다. 글이 재밌어서 계속 보고 싶어 신청드려요."}, {"g": "A", "bid": "dear_children_", "who": "어린이 덕후", "why": "임당검사 후유증 · 솔직한 톤", "home": "https://blog.naver.com/dear_children_", "link": "https://blog.naver.com/dear_children_/224386467910", "title": "임산부들아.. 우울하면 무조건 먹어라", "date": "08-22", "cm": "3번이나 뽑고 혈관까지 터지셨다니 ㅠㅠ 피멍이 일주일 넘게 간다는 건 처음 들었습니다. 고생 많으셨어요", "si": "저희는 10월 출산 예정입니다. 솔직한 기록이 귀해서 신청드려요."}, {"g": "A", "bid": "mingkymom_", "who": "김네잎 결혼·임신·육아 기록", "why": "코스트코 임산부 장보기 · 실용", "home": "https://blog.naver.com/mingkymom_", "link": "https://blog.naver.com/mingkymom_/224386449612", "title": "코스트코에서 임산부는 뭘 살까? 이거는 꼭 사오세요. 코스트코 추....", "date": "08-22", "cm": "입덧 있을 때 아침에 뭔가 씹는 게 힘들다는 말씀, 저희도 딱 그랬어요. 아몬드브리즈랑 견과류는 바로 장바구니에 넣겠습니다 ㅎㅎ", "si": "저희는 10월 출산 예정입니다. 실용적인 정보가 많아 신청드려요."}, {"g": "A", "bid": "withnoodle_", "who": "공감의방", "why": "13주 · 입덧에서 먹덧으로", "home": "https://blog.naver.com/withnoodle_", "link": "https://blog.naver.com/withnoodle_/224386439814", "title": "임신 13주차 입덧 먹덧 마라샹궈 괜찮나", "date": "08-22", "cm": "먹덧으로 넘어가는 시기군요. 마라샹궈라니 ㅋㅋ 저희도 그맘때 갑자기 매운 게 당긴다고 했던 게 생각납니다", "si": "저희는 10월 출산 예정입니다. 저희가 지나온 시기라 반가워 신청드려요."}, {"g": "A", "bid": "bo-ram_", "who": "쀼로그 ෆ", "why": "8주 · 입덧약 처방 기록", "home": "https://blog.naver.com/bo-ram_", "link": "https://blog.naver.com/bo-ram_/224386412308", "title": "임신 8주차 증상 기록 _ 입덧약 처방과 하리보곰젤리 초음파", "date": "08-22", "cm": "8주가 입덧 절정이군요. 하리보곰젤리 초음파라는 표현이 귀엽네요 ㅎㅎ 입덧약 처방받으신 것도 잘하셨어요", "si": "저희는 10월 출산 예정입니다. 초기 기록을 보니 저희 때가 떠올라서 신청드려요."}], GRADE={"S": ["아내와 주수가 겹치거나 소재가 정면으로 겹침", "#c0392b"], "A": ["임신 중 개인 기록형", "#d9534f"], "B": ["용산 아이파크몰 / 도파민스테이션", "#3a5fcd"], "C": ["출산 직후·육아 중", "#8a8a8a"]}, GAS="https://script.google.com/macros/s/AKfycbwJ27_GZz3O8LH8dMm-1PnGLX9o-bO7MexEaYnRhO0PKEd-_jy92IDnKp_vcMr5QCs8pw/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
let filter="";

// 완료 표시는 로컬에 먼저 남긴다. 시트가 느리거나 실패해도 화면은 정확하게.
const LS="seoichu_done";
const local=new Set(JSON.parse(localStorage.getItem(LS)||"[]"));
const save=()=>localStorage.setItem(LS,JSON.stringify([...local]));

function draw(){
  const seen=ROWS.filter(r=>!filter||r.g===filter);
  $("list").innerHTML = seen.length ? seen.map(r=>{
    const d=local.has(r.bid);
    return `<div class="card${d?" done":""}" data-bid="${r.bid}">
      <div class="top">
        <span class="g" style="background:${GRADE[r.g][1]}">${r.g}</span>
        <span class="who"><a href="${r.home}" target="_blank" rel="noopener">${esc(r.who)}</a></span>
        <span class="why">${esc(r.why)}</span><span class="date">${esc(r.date)}</span>
      </div>
      <a class="title" href="${r.link}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <div class="lbl">댓글</div><div class="cm" data-cm>${esc(r.cm)}</div>
      <div class="lbl">서이추 메시지</div><div class="cm si" data-si>${esc(r.si)}</div>
      <div class="row">
        <button data-copy="cm">댓글 복사</button>
        <button data-copy="si">서이추 복사</button>
        <button class="fin" data-fin>${d?"완료됨":"완료"}</button>
      </div></div>`;
  }).join("") : `<div class="empty">이 등급은 다 했다.</div>`;
  $("left").textContent = ROWS.filter(r=>!local.has(r.bid)).length;
}

$("tabs").innerHTML = [["","전체"]].concat(
  [...new Set(ROWS.map(r=>r.g))].sort().map(g=>[g,g+"급"])
).map(([v,t])=>`<button class="tab${v===filter?" on":""}" data-g="${v}">${t}</button>`).join("");
$("tabs").onclick=e=>{const b=e.target.closest(".tab"); if(!b)return;
  filter=b.dataset.g; [...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b)); draw();};

$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card"); if(!card)return;
  const bid=card.dataset.bid;
  const cp=e.target.closest("[data-copy]");
  if(cp){
    const el=card.querySelector(cp.dataset.copy==="cm"?"[data-cm]":"[data-si]");
    navigator.clipboard.writeText(el.innerText).then(()=>{
      const t=cp.textContent; cp.textContent="복사됨"; setTimeout(()=>cp.textContent=t,900);
    });
    return;
  }
  if(!e.target.closest("[data-fin]"))return;
  if(local.has(bid)){                       // 잘못 눌렀을 때 되돌리기
    if(!confirm("완료를 취소할까?"))return;
    local.delete(bid); save(); draw(); return;
  }
  local.add(bid); save(); draw();
  if(!GAS)return;
  const r=ROWS.find(x=>x.bid===bid);
  const pw=localStorage.getItem("pw")||prompt("비밀번호"); if(!pw)return;
  localStorage.setItem("pw",pw);
  // no-cors + text/plain — preflight를 피한다. 응답은 못 읽으니 화면은 이미 반영해뒀다.
  fetch(GAS,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({pw,kind:"seoichu",bid,who:r.who,grade:r.g})})
    .catch(()=>{ $("foot").textContent="전송 실패 — 네트워크 확인 후 다시 눌러라."; });
});

draw();

// 시트가 죽어 있어도 회수는 되게. 폰에 쌓인 완료분을 .commented.txt 형식으로 뱉는다.
$("dump").onclick=()=>{
  const d=ROWS.filter(r=>local.has(r.bid));
  if(!d.length)return alert("완료한 게 없다.");
  const day=new Date().toLocaleDateString("sv-SE");  // 로컬 기준 YYYY-MM-DD
  const lines=d.map(r=>`${day}  ${r.home}  ${r.who}  ?`);
  navigator.clipboard.writeText(lines.join(String.fromCharCode(10)))
    .then(()=>alert(d.length+"명 복사됨. 클로드한테 붙여넣어라."),
          ()=>alert("복사 실패. 길게 눌러 직접 선택해라."));
};

// 다른 기기에서 누른 것도 보이게 시트를 겹쳐 읽는다. JSONP로 CORS 우회.
if(GAS){
  window.__ov=rows=>{
    (rows||[]).forEach(r=>{ if(r.bid) local.add(r.bid); });
    save(); draw();
    $("foot").textContent="시트 동기화됨 · "+local.size+"명 완료";
  };
  const s=document.createElement("script");
  s.src=GAS+"?kind=seoichu&callback=__ov";
  s.onerror=()=>{$("foot").textContent="시트를 못 읽었다. 완료는 이 기기에만 남는다.";};
  document.body.appendChild(s);
}
</script></body></html>
